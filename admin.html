<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · envinando UK</title>
<link rel="icon" href="https://envinando.co.uk/icon-32.png">
<style>
:root{--bg:#f9f5ee;--side:#2c1810;--card:#fff;--wine:#8b2c2c;--gold:#d4a853;--txt:#2c1810;--txt2:#6b4c3b;--border:#e8dcc8;--green:#4f8a5f;--amber:#b7791f;--blue:#3b6b9a;--grey:#8a7a6e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.logo{font-family:Georgia,serif;font-size:22px;color:#fff}.logo strong{font-weight:bold}.logo small{display:block;font-family:Arial;font-size:10px;letter-spacing:2px;color:var(--gold);margin-top:2px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side)}
#login .box{background:var(--card);border-radius:12px;padding:32px;width:340px;max-width:92vw}
#login .logo{color:var(--txt);margin-bottom:18px}
#login label{display:block;font-size:12px;color:var(--txt2);margin:12px 0 4px}
#login input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px}
#login input.code{font-size:24px;letter-spacing:8px;text-align:center}
.btn{background:var(--wine);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--border)}
.btn.small{padding:6px 10px;font-size:12px}
#login .btn{width:100%;margin-top:16px;padding:12px}
.msg{font-size:13px;margin-top:10px;color:var(--wine)}.msg.ok{color:var(--green)}
/* layout */
#app{display:none;min-height:100vh}
nav{position:fixed;top:0;left:0;bottom:0;width:210px;background:var(--side);padding:22px 0;display:flex;flex-direction:column}
nav .logo{padding:0 20px 22px}
nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#e8dcc8;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:rgba(255,255,255,.08);border-left-color:var(--gold);color:#fff}
nav a .badge{margin-left:auto;background:var(--gold);color:var(--side);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
nav .foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#a08e80;line-height:1.7}
nav .foot a{display:inline;padding:0;border:0;color:var(--gold)}
main{margin-left:210px;padding:26px 30px 60px;max-width:1300px}
h1{font-family:Georgia,serif;font-weight:normal;font-size:26px;margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.kpi .l{font-size:12px;color:var(--txt2)}.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--txt2);margin-top:4px}
.kpi.alert{border-color:var(--gold);background:#fffaf0}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:14px}
.chart{height:190px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--border);padding-top:16px}
.chart .bar{flex:1;background:var(--wine);border-radius:3px 3px 0 0;min-height:1px;position:relative;opacity:.85}
.chart .bar:hover{opacity:1}
.chart .bar.zero{background:var(--border)}
.chart .bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;font-size:11px;padding:4px 7px;border-radius:4px;white-space:nowrap;margin-bottom:4px;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-top:6px}
.toplist div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f1e9dc;font-size:13px}
.toplist div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.toolbar input{flex:1;min-width:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:12px}
.tabs button.on{background:var(--side);color:#fff;border-color:var(--side)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);padding:10px 12px;background:#fbf8f2;border-bottom:1px solid var(--border);font-weight:600}
td{padding:10px 12px;border-bottom:1px solid #f1e9dc;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#fdfaf4}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--txt2)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.st-paid{background:#e3f0e6;color:var(--green)}.st-shipped{background:#e2ecf5;color:var(--blue)}.st-delivered{background:#e9e4f2;color:#5b4b8a}
.st-pending,.st-awaiting{background:#fbefd9;color:var(--amber)}.st-cancelled,.st-failed{background:#f3e2e2;color:var(--wine)}.st-checkout{background:#eee;color:var(--grey)}
.ch{font-size:12px}
.empty{padding:40px;text-align:center;color:var(--txt2);background:#fff;border:1px dashed var(--border);border-radius:10px}
/* drawer */
#drawer{position:fixed;inset:0;background:rgba(44,24,16,.35);display:none;z-index:50}
#drawer.open{display:block}
#drawer .d{position:absolute;right:0;top:0;bottom:0;width:520px;max-width:100vw;background:#fff;overflow:auto;padding:24px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#drawer .x{float:right;border:none;background:none;font-size:26px;cursor:pointer;color:var(--txt2);line-height:1}
#drawer h2{font-family:Georgia,serif;font-weight:normal;margin:0 0 4px}
.sec{margin-top:18px}.sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2)}
.items div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f4eee4}
.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .big{font-weight:700;font-size:16px;border-top:1px solid var(--border);margin-top:4px;padding-top:6px}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}
.stbtns button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px}
.stbtns button.on{background:var(--side);color:#fff;border-color:var(--side)}
textarea,.f input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .full{grid-column:1/-1}
.f label{font-size:11px;color:var(--txt2)}
.actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.links a{color:var(--wine);margin-right:12px;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}
@media(max-width:820px){nav{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px;align-items:center}nav .logo{padding:0 12px 0 4px}nav a{padding:8px 10px;border-left:0;border-bottom:2px solid transparent}nav a.on{border-bottom-color:var(--gold)}nav .foot{display:none}main{margin:0;padding:16px}.grid2{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="logo">en<strong>vinando</strong><small>PANEL UK</small></div>
    <div id="l1">
      <label>Tu email de administrador</label>
      <input id="lemail" type="email" autocomplete="email" placeholder="tu@email.com">
      <button class="btn" id="lbtn1">Enviarme un código</button>
    </div>
    <div id="l2" style="display:none">
      <p style="font-size:13px;color:var(--txt2);margin:0">Te hemos enviado un código de 6 cifras a <b id="lsent"></b>.</p>
      <input id="lcode" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="······">
      <button class="btn" id="lbtn2">Entrar</button>
      <p style="text-align:center;margin:12px 0 0"><a href="#" id="lback" style="color:var(--txt2);font-size:12px">Usar otro email</a></p>
    </div>
    <div class="msg" id="lmsg"></div>
  </div>
</div>

<div id="app">
  <nav>
    <div class="logo">en<strong>vinando</strong><small>PANEL UK</small></div>
    <a data-v="home" class="on">📊 Resumen</a>
    <a data-v="orders">📦 Pedidos <span class="badge" id="nav-badge" style="display:none"></span></a>
    <a data-v="customers">👥 Clientes</a>
    <div class="foot"><span id="who"></span><br><a href="https://envinando.co.uk" target="_blank">Ver la web</a> · <a href="#" id="logout">Salir</a></div>
  </nav>
  <main id="view"></main>
</div>

<div id="drawer"><div class="d" id="dbody"></div></div>
<div id="toast"></div>

<script>
const API = 'https://envinando-checkout.gustavoggb76.workers.dev/admin/api';
let TOKEN = localStorage.getItem('env_admin_token') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = v => '£' + Number(v || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ST = {checkout:'Pago sin terminar', pending:'Pendiente (WhatsApp)', awaiting:'Pago en proceso', paid:'Pagado', shipped:'Enviado', delivered:'Entregado', cancelled:'Cancelado', failed:'Fallido'};
const CH = {card:'💳 Tarjeta', whatsapp:'📱 WhatsApp'};
const pill = s => `<span class="pill st-${s}">${ST[s] || s}</span>`;
const fdate = s => { if (!s) return ''; const d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'}) + ' ' + d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}); };
const addr = a => { if (!a) return ''; try { const o = typeof a === 'string' ? JSON.parse(a) : a; return [o.line1, o.line2, o.city, o.postcode].filter(Boolean).join(', '); } catch { return ''; } };
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500); }

async function api(path, opt = {}) {
  const r = await fetch(API + path, {...opt, headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opt.headers || {})}});
  if (r.status === 401 && !path.startsWith('/login')) { logout(); throw new Error('Sesión caducada'); }
  if ((r.headers.get('content-type') || '').includes('text/csv')) return r.blob();
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}

// ---- login ----
let loginEmail = '';
$('#lbtn1').onclick = async () => {
  loginEmail = $('#lemail').value.trim().toLowerCase(); if (!loginEmail) return;
  $('#lbtn1').disabled = true; $('#lmsg').textContent = '';
  try { await api('/login/start', {method: 'POST', body: JSON.stringify({email: loginEmail})}); $('#lsent').textContent = loginEmail; $('#l1').style.display = 'none'; $('#l2').style.display = 'block'; $('#lcode').focus(); }
  catch (e) { $('#lmsg').textContent = e.message; }
  $('#lbtn1').disabled = false;
};
$('#lemail').onkeydown = e => { if (e.key === 'Enter') $('#lbtn1').click(); };
$('#lcode').oninput = e => { if (e.target.value.replace(/\D/g, '').length === 6) $('#lbtn2').click(); };
$('#lbtn2').onclick = async () => {
  $('#lbtn2').disabled = true; $('#lmsg').textContent = '';
  try { const d = await api('/login/verify', {method: 'POST', body: JSON.stringify({email: loginEmail, code: $('#lcode').value.replace(/\D/g, '')})}); TOKEN = d.token; localStorage.setItem('env_admin_token', TOKEN); localStorage.setItem('env_admin_email', d.email); start(); }
  catch (e) { $('#lmsg').textContent = e.message; }
  $('#lbtn2').disabled = false;
};
$('#lback').onclick = e => { e.preventDefault(); $('#l2').style.display = 'none'; $('#l1').style.display = 'block'; $('#lcode').value = ''; };
function logout() { if (TOKEN) fetch(API + '/logout', {method: 'POST', headers: {Authorization: 'Bearer ' + TOKEN}}).catch(() => {}); TOKEN = ''; localStorage.removeItem('env_admin_token'); $('#app').style.display = 'none'; $('#login').style.display = 'flex'; }
$('#logout').onclick = e => { e.preventDefault(); logout(); };

// ---- navigation ----
let VIEW = 'home';
document.querySelectorAll('nav a[data-v]').forEach(a => a.onclick = () => go(a.dataset.v));
function go(v, arg) { VIEW = v; document.querySelectorAll('nav a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === v)); closeDrawer(); ({home: home, orders: orders, customers: customers})[v](arg); }
function start() { $('#login').style.display = 'none'; $('#app').style.display = 'block'; $('#who').textContent = localStorage.getItem('env_admin_email') || ''; go('home'); }

// ---- home ----
async function home() {
  $('#view').innerHTML = '<h1>Resumen</h1><p class="sub">Cargando…</p>';
  const s = await api('/stats');
  badge(s.toShip.n + s.pending.n);
  const diff = s.prevMonth.s ? Math.round((s.month.s - s.prevMonth.s) / s.prevMonth.s * 100) : null;
  const days = []; const map = Object.fromEntries(s.daily.map(d => [d.d, d]));
  for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); days.push({d, s: map[d]?.s || 0, n: map[d]?.n || 0}); }
  const max = Math.max(1, ...days.map(d => d.s));
  const ch = Object.fromEntries(s.byChannel.map(c => [c.channel, c]));
  $('#view').innerHTML = `<h1>Resumen</h1>
  <div class="kpis">
    <div class="kpi"><div class="l">Ventas este mes</div><div class="v">${gbp(s.month.s)}</div><div class="s">${s.month.n} pedido${s.month.n===1?'':'s'}${diff !== null ? ` · ${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff)}% vs mes anterior` : ''}</div></div>
    <div class="kpi ${s.toShip.n ? 'alert' : ''}"><div class="l">Pagados por enviar</div><div class="v">${s.toShip.n}</div><div class="s"><a href="#" onclick="go('orders','paid');return false" style="color:var(--wine)">Ver pedidos</a></div></div>
    <div class="kpi ${s.pending.n ? 'alert' : ''}"><div class="l">Pendientes de pago</div><div class="v">${s.pending.n}</div><div class="s">${gbp(s.pending.s)} · <a href="#" onclick="go('orders','pending');return false" style="color:var(--wine)">Ver</a></div></div>
    <div class="kpi"><div class="l">Ticket medio</div><div class="v">${gbp(s.all.n ? s.all.s / s.all.n : 0)}</div><div class="s">${s.all.n} pedido${s.all.n===1?'':'s'} · ${s.all.b} botellas en total</div></div>
    <div class="kpi"><div class="l">Clientes</div><div class="v">${s.custs.n}</div><div class="s">${s.regs.n} con cuenta · ${s.newCusts.n} nuevos este mes</div></div>
    <div class="kpi"><div class="l">Ventas totales</div><div class="v">${gbp(s.all.s)}</div><div class="s">💳 ${gbp(ch.card?.s)} · 📱 ${gbp(ch.whatsapp?.s)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Ventas de los últimos 30 días</h3>
      <div class="chart">${days.map(d => `<div class="bar ${d.s ? '' : 'zero'}" style="height:${d.s ? Math.max(3, d.s / max * 100) : 1}%" data-t="${new Date(d.d).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'})}: ${gbp(d.s)} (${d.n})"></div>`).join('')}</div>
      <div class="axis"><span>${new Date(days[0].d).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'})}</span><span>hoy</span></div>
      ${s.abandoned.n ? `<p class="sub" style="margin:12px 0 0">🛒 ${s.abandoned.n} pago${s.abandoned.n===1?'':'s'} con tarjeta sin terminar en 30 días (${gbp(s.abandoned.s)}). <a href="#" onclick="go('orders','checkout');return false" style="color:var(--wine)">Ver</a></p>` : ''}
    </div>
    <div class="panel"><h3>Lo más vendido (90 días)</h3><div class="toplist">${s.top.length ? s.top.map(t => `<div><span>${t.lot ? '📦 ' : ''}${esc(t.name)}</span><span class="sub">${t.qty} · ${gbp(t.total)}</span></div>`).join('') : '<p class="sub">Aún no hay ventas.</p>'}</div></div>
  </div>`;
}
function badge(n) { const b = $('#nav-badge'); b.textContent = n; b.style.display = n ? '' : 'none'; }

// ---- orders ----
let OF = {status: 'active', channel: '', q: ''}, ORDERS = [];
async function orders(st) {
  if (st) OF.status = st;
  const tabs = [['active', 'Todos'], ['pending', 'Pendientes'], ['paid', 'Por enviar'], ['shipped', 'Enviados'], ['delivered', 'Entregados'], ['cancelled', 'Cancelados'], ['checkout', 'Pago sin terminar'], ['all', 'Todo']];
  $('#view').innerHTML = `<h1>Pedidos</h1>
  <div class="tabs">${tabs.map(([k, l]) => `<button data-s="${k}" class="${OF.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div class="toolbar"><input id="oq" placeholder="Buscar por nº, nombre, email, teléfono, dirección o vino…" value="${esc(OF.q)}">
  <select id="och"><option value="">Todos los canales</option><option value="card">💳 Tarjeta</option><option value="whatsapp">📱 WhatsApp</option></select>
  <button class="btn ghost small" id="ocsv">⬇ Exportar CSV</button></div>
  <div id="olist"><p class="sub">Cargando…</p></div>`;
  $('#och').value = OF.channel;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { OF.status = b.dataset.s; orders(); });
  let t; $('#oq').oninput = e => { clearTimeout(t); t = setTimeout(() => { OF.q = e.target.value; loadOrders(); }, 300); };
  $('#och').onchange = e => { OF.channel = e.target.value; loadOrders(); };
  $('#ocsv').onclick = async () => download(await api('/orders?' + qs({...OF, format: 'csv'})), 'envinando-pedidos.csv');
  loadOrders();
}
const qs = o => new URLSearchParams(Object.entries(o).filter(([k, v]) => v)).toString();
async function loadOrders() {
  const d = await api('/orders?' + qs(OF)); ORDERS = d.orders;
  if (!ORDERS.length) { $('#olist').innerHTML = '<div class="empty">No hay pedidos con estos filtros.</div>'; return; }
  $('#olist').innerHTML = `<table><thead><tr><th>Pedido</th><th>Cliente</th><th class="hide-m">Productos</th><th>Estado</th><th class="num">Total</th></tr></thead><tbody>
  ${ORDERS.map(o => { const it = JSON.parse(o.items); return `<tr class="click" data-id="${o.id}">
    <td><b>${o.ref}</b><div class="sub">${fdate(o.created_at)}</div><div class="ch">${CH[o.channel] || o.channel}</div></td>
    <td>${esc(o.name) || '<span class="sub">Sin datos</span>'}<div class="sub">${esc(o.email)}</div><div class="sub">${esc(addr(o.address).split(', ').slice(-2).join(', '))}</div></td>
    <td class="hide-m sub">${it.slice(0, 3).map(i => `${i.qty} × ${esc(i.name)}`).join('<br>')}${it.length > 3 ? `<br>+${it.length - 3} más` : ''}</td>
    <td>${pill(o.status)}</td><td class="num"><b>${gbp(o.total)}</b><div class="sub">${o.bottles} bot.</div></td></tr>`; }).join('')}
  </tbody></table>`;
  document.querySelectorAll('#olist tr.click').forEach(tr => tr.onclick = () => openOrder(ORDERS.find(o => o.id == tr.dataset.id)));
}
function openOrder(o) {
  const it = JSON.parse(o.items); const a = o.address ? JSON.parse(o.address) : {};
  const flow = o.channel === 'whatsapp' ? ['pending', 'paid', 'shipped', 'delivered', 'cancelled'] : ['paid', 'shipped', 'delivered', 'cancelled'];
  const wa = (o.phone || '').replace(/[^\d]/g, '').replace(/^0/, '44');
  $('#dbody').innerHTML = `<button class="x" onclick="closeDrawer()">×</button>
  <h2>${o.ref}</h2><div class="sub">${fdate(o.created_at)} · ${CH[o.channel]} · ${pill(o.status)}</div>
  <div class="sec"><h4>Estado</h4><div class="stbtns">${flow.map(s => `<button data-s="${s}" class="${o.status === s ? 'on' : ''}">${ST[s]}</button>`).join('')}</div></div>
  <div class="sec"><h4>Productos</h4><div class="items">${it.map(i => `<div><span>${i.qty} × ${esc(i.name)} <span class="sub">${i.lot ? '' : esc(i.y)} · ${gbp(i.unit)}${i.lot ? '/caja' : '/bot.'}</span></span><span>${gbp(i.total)}</span></div>`).join('')}</div>
  <div class="tot" style="margin-top:8px">${o.wines ? `<div><span>Vinos</span><span>${gbp(o.wines)}</span></div>` : ''}${o.discount ? `<div style="color:var(--green)"><span>Descuento 10%</span><span>−${gbp(o.discount)}</span></div>` : ''}${o.lots ? `<div><span>Lotes</span><span>${gbp(o.lots)}</span></div>` : ''}<div><span>Envío (${o.boxes} caja${o.boxes > 1 ? 's' : ''})</span><span>${o.shipping ? gbp(o.shipping) : 'Gratis'}</span></div><div class="big"><span>Total</span><span>${gbp(o.total)}</span></div></div></div>
  <div class="sec"><h4>Cliente y entrega</h4>
    <div class="f"><div class="full"><label>Nombre</label><input id="e-name" value="${esc(o.name)}"></div>
    <div><label>Email</label><input id="e-email" value="${esc(o.email)}"></div><div><label>Teléfono</label><input id="e-phone" value="${esc(o.phone)}"></div>
    <div class="full"><label>Dirección</label><input id="e-l1" value="${esc(a.line1)}"></div><div class="full"><input id="e-l2" value="${esc(a.line2)}" placeholder="Línea 2 (opcional)"></div>
    <div><label>Ciudad</label><input id="e-city" value="${esc(a.city)}"></div><div><label>Código postal</label><input id="e-pc" value="${esc(a.postcode)}"></div></div>
    <div class="links" style="margin-top:8px">${wa ? `<a href="https://wa.me/${wa}" target="_blank">📱 WhatsApp</a>` : ''}${o.email ? `<a href="mailto:${esc(o.email)}?subject=${encodeURIComponent('Your envinando order ' + o.ref)}">✉️ Email</a>` : ''}${o.customer_id ? `<a href="#" onclick="openCustomer(${o.customer_id});return false">👤 Ficha del cliente</a>` : ''}</div></div>
  <div class="sec"><h4>Notas internas</h4><textarea id="e-notes" placeholder="Ej.: entregado por el importador, nº de seguimiento…">${esc(o.notes)}</textarea></div>
  <div class="actions"><button class="btn" id="e-save">Guardar cambios</button><span class="sub" id="e-msg"></span></div>`;
  let status = o.status;
  document.querySelectorAll('.stbtns button').forEach(b => b.onclick = () => { status = b.dataset.s; document.querySelectorAll('.stbtns button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#e-save').onclick = async () => {
    $('#e-save').disabled = true;
    try {
      await api('/orders/' + o.id, {method: 'PATCH', body: JSON.stringify({status, notes: $('#e-notes').value, name: $('#e-name').value, email: $('#e-email').value, phone: $('#e-phone').value,
        address: {line1: $('#e-l1').value, line2: $('#e-l2').value, city: $('#e-city').value, postcode: $('#e-pc').value}})});
      toast('Pedido ' + o.ref + ' guardado'); closeDrawer(); if (VIEW === 'orders') loadOrders(); else go(VIEW);
    } catch (e) { $('#e-msg').textContent = e.message; }
    $('#e-save').disabled = false;
  };
  $('#drawer').classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); }
$('#drawer').onclick = e => { if (e.target.id === 'drawer') closeDrawer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ---- customers ----
let CQ = '', CUSTS = [];
async function customers() {
  $('#view').innerHTML = `<h1>Clientes</h1>
  <div class="toolbar"><input id="cq" placeholder="Buscar por nombre, email, teléfono, ciudad o código postal…" value="${esc(CQ)}"><button class="btn ghost small" id="ccsv">⬇ Exportar CSV</button></div>
  <div id="clist"><p class="sub">Cargando…</p></div>`;
  let t; $('#cq').oninput = e => { clearTimeout(t); t = setTimeout(() => { CQ = e.target.value; loadCustomers(); }, 300); };
  $('#ccsv').onclick = async () => download(await api('/customers?' + qs({q: CQ, format: 'csv'})), 'envinando-clientes.csv');
  loadCustomers();
}
async function loadCustomers() {
  CUSTS = (await api('/customers?' + qs({q: CQ}))).customers;
  if (!CUSTS.length) { $('#clist').innerHTML = '<div class="empty">Aún no hay clientes. Aparecerán aquí cuando alguien cree su cuenta o haga un pedido.</div>'; return; }
  $('#clist').innerHTML = `<table><thead><tr><th>Cliente</th><th class="hide-m">Teléfono</th><th class="hide-m">Zona</th><th>Cuenta</th><th class="num">Pedidos</th><th class="num">Gastado</th></tr></thead><tbody>
  ${CUSTS.map(c => `<tr class="click" data-id="${c.id}"><td>${esc(c.name) || '<span class="sub">Sin nombre</span>'}<div class="sub">${esc(c.email)}</div></td>
  <td class="hide-m">${esc(c.phone)}</td><td class="hide-m">${esc([c.city, c.postcode].filter(Boolean).join(' · '))}</td>
  <td>${c.registered ? '<span class="pill st-paid">Registrado</span>' : '<span class="pill st-checkout">Invitado</span>'}${c.marketing ? ' <span title="Acepta emails de ofertas">✉️</span>' : ''}</td>
  <td class="num">${c.orders}</td><td class="num"><b>${gbp(c.spent)}</b><div class="sub">${c.last_order ? fdate(c.last_order).split(' ')[0] + ' ' + fdate(c.last_order).split(' ')[1] : ''}</div></td></tr>`).join('')}
  </tbody></table>`;
  document.querySelectorAll('#clist tr.click').forEach(tr => tr.onclick = () => openCustomer(tr.dataset.id));
}
async function openCustomer(id) {
  const {customer: c, orders: os} = await api('/customers/' + id);
  const wa = (c.phone || '').replace(/[^\d]/g, '').replace(/^0/, '44');
  const spent = os.filter(o => ['paid', 'shipped', 'delivered'].includes(o.status)).reduce((s, o) => s + o.total, 0);
  $('#dbody').innerHTML = `<button class="x" onclick="closeDrawer()">×</button>
  <h2>${esc(c.name) || esc(c.email)}</h2><div class="sub">${c.registered ? 'Cuenta registrada' : 'Cliente invitado'} · desde ${fdate(c.created_at).split(' ').slice(0, 2).join(' ')}${c.marketing ? ' · acepta emails de ofertas' : ''}</div>
  <div class="sec"><h4>Contacto</h4><div>${esc(c.email)}<br>${esc(c.phone)}<br>${esc([c.line1, c.line2, c.city, c.postcode].filter(Boolean).join(', '))}</div>
  <div class="links" style="margin-top:8px">${wa ? `<a href="https://wa.me/${wa}" target="_blank">📱 WhatsApp</a>` : ''}<a href="mailto:${esc(c.email)}">✉️ Email</a></div></div>
  <div class="sec"><h4>Pedidos (${os.length}) · ${gbp(spent)} gastado</h4>${os.length ? `<div class="items">${os.map(o => `<div style="cursor:pointer" data-id="${o.id}"><span><b>${o.ref}</b> <span class="sub">${fdate(o.created_at)} · ${CH[o.channel]}</span> ${pill(o.status)}</span><span>${gbp(o.total)}</span></div>`).join('')}</div>` : '<p class="sub">Sin pedidos todavía.</p>'}</div>
  <div class="sec"><h4>Notas internas</h4><textarea id="c-notes" placeholder="Preferencias, regalos, cómo prefiere la entrega…">${esc(c.notes)}</textarea></div>
  <div class="actions"><button class="btn" id="c-save">Guardar nota</button></div>`;
  document.querySelectorAll('#dbody .items div[data-id]').forEach(d => d.onclick = async () => {
    const o = (await api('/orders?' + qs({status: 'all', q: os.find(x => x.id == d.dataset.id).ref}))).orders[0]; if (o) openOrder(o);
  });
  $('#c-save').onclick = async () => { await api('/customers/' + c.id, {method: 'PATCH', body: JSON.stringify({notes: $('#c-notes').value})}); toast('Nota guardada'); };
  $('#drawer').classList.add('open');
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

if (TOKEN) start();
</script>
